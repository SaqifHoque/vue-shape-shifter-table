version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /docs-site
      - /examples/minimal
    schedule:
      interval: weekly
    groups:
      compatible:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
